calibration_node:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    base_frame: base_footprint
    camera_frame: camera_optical_frame
    camera_width: 480
    camera_height: 360
    horizontal_fov_rad: 1.7453
    distortion: [-0.045, -0.0001, -0.0003, -0.0001, 0.001]
    frame_step: 5
    tf_timeout_sec: 0.05
    bev_x_min_m: 0.15
    bev_x_max_m: 3.0
    bev_y_left_m: 1.2
    bev_y_right_m: 1.2
    bev_resolution_m: 0.02
    ground_z_m: 0.0
    yellow_hsv_lower: [8, 80, 80]
    yellow_hsv_upper: [40, 255, 255]
    minimum_lane_points: 30
    minimum_lane_span_m: 0.4
    maximum_lane_residual_m: 0.08
    minimum_confidence: 0.15
    publish_debug_images: true
    # Leave empty until a measured Lane Map centerline is available.
    reference_centerline_file: ""
    reference_frame: map
    maximum_detection_age_sec: 0.25
    maximum_match_distance_m: 0.35
    minimum_correction_matches: 8
    maximum_lateral_correction_m: 0.20
    maximum_yaw_correction_rad: 0.12
    correction_smoothing_alpha: 0.25
