calibration_node:
  ros__parameters:
    # Use the four simulator fence lines for full x/y/yaw correction. Set this
    # back to `lane` to retain the camera-centerline correction path.
    correction_source: fence
    image_topic: /camera/image_raw/compressed
    scan_topic: /scan_filtered
    base_frame: base_footprint
    camera_frame: camera_optical_frame
    camera_width: 480
    camera_height: 360
    horizontal_fov_rad: 1.7453
    distortion: [-0.045, -0.0001, -0.0003, -0.0001, 0.001]
    frame_step: 3
    tf_timeout_sec: 0.05
    # Simulator camera messages can arrive a few milliseconds before dynamic TF.
    # Negative means use the latest mounting TF when simulator timestamps drift.
    maximum_camera_tf_age_sec: -1.0
    bev_x_min_m: 0.15
    bev_x_max_m: 1.5
    bev_y_left_m: 1.2
    bev_y_right_m: 1.2
    bev_resolution_m: 0.02
    ground_z_m: 0.0
    # Measured BEV lane color. High-saturation orange cones fall outside it.
    yellow_hsv_lower: [15, 30, 30]
    yellow_hsv_upper: [31, 220, 220]
    minimum_lane_points: 12
    minimum_lane_span_m: 0.3
    minimum_lane_component_area_px: 4
    observed_point_spacing_m: 0.04
    minimum_confidence: 0.20
    publish_debug_images: true
    reference_lane_map_file: docs/sim_lane_map_world_color.png
    reference_lane_map_resolution_m: 0.01
    reference_lane_map_origin_x_m: 0.0
    reference_lane_map_origin_y_m: 0.0
    reference_lane_map_hsv_lower: [14, 135, 145]
    reference_lane_map_hsv_upper: [32, 255, 255]
    reference_lane_point_spacing_m: 0.02
    reference_lane_tangent_radius_m: 0.10
    # Legacy ordered CSV fallback. The calibrated color map above takes precedence.
    reference_centerline_file: ""
    reference_frame: map
    maximum_detection_age_sec: 0.30
    maximum_match_distance_m: 0.35
    minimum_correction_matches: 8
    # Non-positive disables absolute lateral clipping. Matching is performed
    # from the persistent corrected pose, so this value is a residual update.
    maximum_lateral_correction_m: -1.0
    maximum_yaw_correction_rad: 0.12
    # Do not calibrate from stationary/creeping observations. The initial bag
    # showed a repeatable 6.8 cm false lateral correction below 0.10 m/s.
    minimum_correction_speed_m_s: 0.10
    # Keep only an extreme-residual guard. The strict consistency gate made
    # sparse corrections persist too long and worsened true-position RMSE.
    maximum_correction_rms_error_m: 0.25
    # Non-positive disables the absolute lateral acceptance limit.
    maximum_accepted_lateral_correction_m: -1.0
    maximum_accepted_yaw_correction_rad: 0.12
    maximum_correction_lateral_jump_m: 0.25
    maximum_correction_yaw_jump_rad: 0.20
    required_consistent_corrections: 1
    # True-pose replay showed lane yaw RMSE was worse than raw IMU/odom yaw.
    use_lane_yaw_correction: false
    # A zero lane residual confirms the existing persistent correction; it is
    # not an instruction to rebuild the corrected pose from raw odometry.
    minimum_lateral_correction_update_m: 0.01
    # EKF performs temporal fusion; keep the geometric measurement unsmoothed.
    correction_smoothing_alpha: 1.0
    # Minimum process-noise floor. Dynamic Q also integrates /odom twist covariance.
    correction_ekf_process_position_variance_per_sec: 0.0025
    correction_ekf_process_yaw_variance_per_sec: 0.0016
    correction_ekf_minimum_position_variance: 0.0025
    correction_ekf_measurement_yaw_variance: 0.0076
    # Even after an EKF update, expose correction gradually to prevent teleporting.
    maximum_correction_position_rate_m_s: 0.08
    maximum_correction_yaw_rate_rad_s: 0.08
    # Fit short observed sections independently, then compare with map tangents.
    local_fit_radius_m: 0.20
    minimum_local_fit_points: 3
    maximum_tangent_angle_difference_rad: 0.44
    # Fence reference in sim_world/map. Interior cones are rejected because
    # only returns close to these finite line segments enter the optimizer.
    maximum_scan_age_sec: 0.15
    scan_stride: 2
    fence_minimum_x_m: 0.0
    fence_maximum_x_m: 12.0
    fence_minimum_y_m: 0.0
    fence_maximum_y_m: 7.0
    fence_maximum_match_distance_m: 0.25
    fence_segment_endpoint_margin_m: 0.10
    fence_minimum_matches: 80
    fence_minimum_segments: 3
    fence_minimum_matches_per_segment: 10
    fence_maximum_position_correction_m: 0.35
    fence_maximum_yaw_correction_rad: 0.15
    fence_huber_delta_m: 0.03
    fence_maximum_rms_error_m: 0.08
    # The simulator always spawns at this map pose. The first raw /odom sample
    # establishes one fixed map->odom transform; truth is not used.
    use_fixed_start_pose: true
    fixed_start_map_x_m: 1.4
    fixed_start_map_y_m: 3.4
    fixed_start_map_yaw_rad: -1.5707963267948966
