control_node:
  ros__parameters:
    # 안정성과 랩타임의 권장 절충 시작점
    target_speed_m_s: 0.85
    max_speed_m_s: 0.85
    pure_pursuit.lookahead_distance_m: 0.62
    speed_lookahead.enabled: true
    speed_lookahead.lookahead_time_sec: 0.85
    speed_lookahead.min_lookahead_m: 0.62
    speed_lookahead.max_lookahead_m: 1.20
    longitudinal_pid.enabled: false
    longitudinal_pid.kp: 0.0
    longitudinal_pid.ki: 0.0
    longitudinal_pid.kd: 0.0
    longitudinal_pid.output_min: 0.0
    longitudinal_pid.output_max: 0.0
    longitudinal_pid.integral_min: 0.0
    longitudinal_pid.integral_max: 0.0
    adaptive_control.enabled: true
    adaptive_control.preview_distance_m: 1.50
    adaptive_control.min_lookahead_m: 0.62
    adaptive_control.max_lookahead_m: 1.20
    adaptive_control.curvature_reference_inv_m: 2.1
    adaptive_control.max_lateral_acceleration_m_s2: 0.60
    adaptive_control.min_speed_limit_m_s: 0.40
    adaptive_control.max_speed_limit_m_s: 0.85
